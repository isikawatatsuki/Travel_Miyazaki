<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>旅のしおり — Direction C</title>
  <link rel="icon" href="../public/icons/favicon.svg" type="image/svg+xml">
  <style>
    /*
      Assumptions / reasoning
      - Direction C treats the viewport as a folded sheet: the left side stores the ticket,
        while the right side opens the selected trip. On a phone those two sides become a
        deliberate, keyboard-operable view switch.
      - The ticket perforation continues as the trip itinerary line, making movement—not a
        generic card grid—the organizing form. White space is intentionally left active.
      - A restrained indigo route ink and vermilion stamp ink sit on warm paper neutrals.
        Typography uses local Japanese system faces only; no network assets or invented copy.
      - “Kenya Hara–influenced” refers only to the requested direction of quiet Japanese
        information design. It does not claim endorsement and does not reproduce a brand.
    */
    :root {
      --paper: #f8f6ef;
      --paper-deep: #eeebe1;
      --ink: #20221f;
      --ink-soft: #5f625c;
      --rule: #c9c6bb;
      --route: #183c54;
      --stamp: #a33d2f;
      --focus: #1675a5;
      --ease: 220ms cubic-bezier(.22,.72,.28,1);
    }

    * { box-sizing: border-box; }
    html { background: var(--paper-deep); }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100dvh;
      color: var(--ink);
      background:
        linear-gradient(90deg, transparent 0 49.92%, rgba(63,62,56,.055) 50%, transparent 50.08%),
        var(--paper);
      font-family: "Yu Gothic", "YuGothic", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      font-size: 16px;
      line-height: 1.65;
      letter-spacing: .035em;
      -webkit-font-smoothing: antialiased;
    }

    button { font: inherit; }
    button, [role="button"] { touch-action: manipulation; }
    :focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }
    .skip-link {
      position: fixed; left: 16px; top: 12px; z-index: 20;
      padding: 10px 16px; background: var(--ink); color: white;
      transform: translateY(-150%); transition: transform var(--ease);
    }
    .skip-link:focus { transform: translateY(0); }

    .folio {
      width: min(1328px, calc(100% - 64px));
      min-height: min(836px, calc(100dvh - 64px));
      margin: 32px auto;
      border-top: 1px solid var(--ink);
      border-bottom: 1px solid var(--ink);
      display: grid;
      grid-template-columns: minmax(390px, .82fr) minmax(600px, 1.48fr);
      position: relative;
    }

    .folio::before {
      content: ""; position: absolute; inset: 0 auto 0 38.3%; width: 1px;
      background: var(--rule); pointer-events: none;
    }

    .masthead {
      grid-column: 1 / -1;
      min-height: 78px;
      border-bottom: 1px solid var(--rule);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 24px;
    }
    .wordmark { display: flex; align-items: baseline; gap: 18px; }
    .wordmark strong { font-family: "Yu Mincho", "Hiragino Mincho ProN", serif; font-size: 19px; letter-spacing: .18em; font-weight: 500; }
    .wordmark span, .section-code, .eyebrow {
      font-family: Arial, sans-serif; font-size: 11px; letter-spacing: .18em; color: var(--ink-soft);
    }
    .device { justify-self: end; display: inline-flex; align-items: center; min-height: 44px; gap: 9px; font-size: 13px; color: var(--ink-soft); }
    .device::before { content: ""; width: 8px; height: 8px; border: 1px solid var(--route); border-radius: 50%; background: var(--paper); }

    .view-switch { display: flex; gap: 4px; padding: 3px; border: 1px solid var(--rule); }
    .view-switch button {
      min-height: 44px; min-width: 92px; padding: 8px 14px; border: 0;
      background: transparent; color: var(--ink-soft); cursor: pointer;
      transition: color var(--ease), background var(--ease);
    }
    .view-switch button[aria-pressed="true"] { background: var(--route); color: white; }
    .view-switch button:hover:not([aria-pressed="true"]) { background: var(--paper-deep); color: var(--ink); }
    .view-switch button:active { opacity: .72; }

    .panel { min-width: 0; }
    .tickets { padding: clamp(40px, 5vw, 72px) clamp(32px, 4vw, 64px) 48px 0; }
    .trip { padding: clamp(40px, 5vw, 72px) 0 0 clamp(48px, 5vw, 80px); }
    .section-code { margin: 0 0 30px; }
    h1, h2, p { margin-top: 0; }
    h1, h2 {
      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
      font-weight: 500;
    }
    .tickets h1 { margin-bottom: 56px; font-size: clamp(30px, 3vw, 44px); line-height: 1.25; letter-spacing: .16em; }
    .tickets h1 small { display: block; margin-top: 10px; font: 11px/1.4 Arial, sans-serif; letter-spacing: .23em; color: var(--ink-soft); }

    .ticket {
      position: relative;
      width: 100%;
      padding: 0;
      border: 0;
      border-block: 1px solid var(--ink);
      background: transparent;
      color: inherit;
      text-align: left;
      cursor: pointer;
      transition: background var(--ease);
    }
    .ticket:hover { background: rgba(255,255,255,.55); }
    .ticket:active { background: var(--paper-deep); }
    .ticket::after {
      content: ""; position: absolute; inset: auto 0 -7px 0; height: 12px;
      background: radial-gradient(circle at 6px 6px, var(--paper) 2.5px, transparent 3px) 0 0 / 12px 12px repeat-x;
      pointer-events: none;
    }
    .ticket-top { display: grid; grid-template-columns: 1fr auto; gap: 24px; padding: 18px 0 22px; border-bottom: 1px dashed var(--rule); }
    .ticket-title { font-family: "Yu Mincho", "Hiragino Mincho ProN", serif; font-size: 20px; letter-spacing: .14em; }
    .stamp {
      align-self: start; display: grid; place-items: center; width: 66px; height: 66px;
      border: 2px solid var(--stamp); border-radius: 50%; color: var(--stamp);
      font-size: 12px; line-height: 1.3; text-align: center; letter-spacing: .08em;
      transform: rotate(-7deg);
    }
    .route-text { margin: 9px 0 0; color: var(--route); font-weight: 600; letter-spacing: .045em; }
    .ticket-bottom { display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: end; padding: 18px 0 21px; }
    .ticket-date { font: 25px/1.2 Georgia, serif; letter-spacing: .08em; }
    .ticket-meta { display: flex; gap: 16px; color: var(--ink-soft); font-size: 13px; }
    .ticket-open { font-size: 13px; color: var(--route); border-bottom: 1px solid var(--route); padding-bottom: 2px; }

    .issue {
      min-height: 48px; margin-top: 54px; padding: 0 22px; border: 1px solid var(--route);
      background: transparent; color: var(--route); cursor: pointer; letter-spacing: .11em;
      transition: background var(--ease), color var(--ease);
    }
    .issue:hover { background: var(--route); color: white; }
    .issue:active { opacity: .72; }

    .trip-head { display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: start; margin-right: clamp(24px, 4vw, 58px); }
    .trip h2 { margin-bottom: 6px; font-size: clamp(32px, 4vw, 58px); line-height: 1.18; letter-spacing: .08em; }
    .trip-name { margin-bottom: 6px; color: var(--ink-soft); }
    .trip-date { font: 14px/1.4 Arial, sans-serif; letter-spacing: .16em; color: var(--route); }
    .seal {
      display: grid; place-items: center; width: 80px; height: 80px;
      border: 2px solid var(--stamp); color: var(--stamp); transform: rotate(3deg);
      font-family: "Yu Mincho", serif; font-size: 15px; line-height: 1.4; text-align: center;
    }

    .facts {
      margin: 50px clamp(24px, 4vw, 58px) 0 0;
      padding: 0; list-style: none;
      display: grid; grid-template-columns: repeat(3, 1fr);
      border-block: 1px solid var(--rule);
    }
    .facts li { min-height: 112px; padding: 17px 18px 17px 0; }
    .facts li + li { border-left: 1px solid var(--rule); padding-left: 18px; }
    .facts .eyebrow { display: block; margin-bottom: 13px; }
    .facts strong { display: block; font-size: 16px; line-height: 1.45; letter-spacing: .04em; }
    .facts small { display: block; margin-top: 4px; color: var(--ink-soft); font-size: 13px; }

    .next { position: relative; margin: 42px clamp(24px, 4vw, 58px) 0 0; padding-left: 102px; }
    .next::before { content: ""; position: absolute; left: 47px; top: 10px; bottom: 28px; width: 1px; background: var(--route); }
    .next h3 { margin: 0 0 22px -102px; font-size: 13px; font-weight: 500; letter-spacing: .16em; }
    .itinerary { margin: 0; padding: 0; list-style: none; }
    .itinerary li { position: relative; display: grid; grid-template-columns: 72px 1fr; min-height: 56px; align-items: start; padding-bottom: 14px; }
    .itinerary li::before {
      content: ""; position: absolute; left: -59px; top: 7px; width: 9px; height: 9px;
      border: 2px solid var(--route); border-radius: 50%; background: var(--paper);
    }
    .itinerary time { font: 15px/1.5 Arial, sans-serif; color: var(--route); letter-spacing: .06em; }
    .itinerary span { font-size: 16px; }

    .trip-nav {
      margin: 24px clamp(24px, 4vw, 58px) 0 0; padding: 0; list-style: none;
      display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1px solid var(--ink);
    }
    .trip-nav button {
      width: 100%; min-height: 58px; border: 0; border-bottom: 2px solid transparent;
      background: transparent; color: var(--ink-soft); cursor: pointer; font-size: 14px;
      transition: color var(--ease), background var(--ease), border-color var(--ease);
    }
    .trip-nav li + li { border-left: 1px solid var(--rule); }
    .trip-nav button[aria-current="page"] { color: var(--route); border-bottom-color: var(--route); font-weight: 700; }
    .trip-nav button:hover { background: rgba(255,255,255,.62); color: var(--ink); }
    .trip-nav button:active { background: var(--paper-deep); }

    @media (max-width: 760px) {
      body { background: var(--paper); font-size: 16px; }
      .folio { width: 100%; min-height: 100dvh; margin: 0; border: 0; display: block; }
      .folio::before { display: none; }
      .masthead {
        min-height: 72px; padding: 12px 16px; grid-template-columns: 1fr auto;
        position: sticky; top: 0; z-index: 10; background: rgba(248,246,239,.96);
      }
      .wordmark span, .device { display: none; }
      .wordmark strong { font-size: 16px; }
      .view-switch { gap: 2px; }
      .view-switch button { min-width: 68px; padding-inline: 10px; }
      .panel { display: none; padding: 34px 20px 120px; }
      .panel.is-active { display: block; animation: reveal var(--ease) both; }
      .tickets h1 { margin-bottom: 40px; font-size: 31px; }
      .ticket-top { padding-top: 16px; }
      .ticket-date { font-size: 22px; }
      .ticket-meta { gap: 11px; flex-wrap: wrap; }
      .issue { width: 100%; margin-top: 48px; }
      .trip { padding-top: 32px; }
      .trip-head { margin-right: 0; }
      .trip h2 { font-size: 35px; letter-spacing: .055em; }
      .seal { width: 62px; height: 62px; font-size: 12px; }
      .facts { margin: 34px 0 0; grid-template-columns: 1fr; }
      .facts li { min-height: auto; padding: 15px 0; display: grid; grid-template-columns: 90px 1fr; align-items: baseline; }
      .facts li + li { border-left: 0; border-top: 1px solid var(--rule); padding-left: 0; }
      .facts .eyebrow { margin: 0; }
      .next { margin: 34px 0 0; padding-left: 76px; }
      .next::before { left: 28px; }
      .next h3 { margin-left: -76px; }
      .itinerary li { grid-template-columns: 62px 1fr; }
      .itinerary li::before { left: -53px; }
      .trip-nav {
        position: fixed; z-index: 9; left: 0; right: 0; bottom: 0; margin: 0;
        padding-bottom: env(safe-area-inset-bottom); background: var(--paper);
        box-shadow: 0 -1px 0 var(--rule); border-top: 0;
      }
      .trip-nav button { min-height: 62px; font-size: 12px; }
    }

    @media (min-width: 761px) {
      .panel { display: block !important; }
      .view-switch { visibility: hidden; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation: none !important; transition-duration: .01ms !important; }
    }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">本文へ移動</a>
  <main class="folio" id="main">
    <header class="masthead">
      <div class="wordmark">
        <strong>旅のしおり</strong>
        <span>TRAVEL TICKETS</span>
      </div>
      <div class="view-switch" aria-label="表示する画面">
        <button type="button" data-view="tickets" aria-pressed="true">チケット</button>
        <button type="button" data-view="trip" aria-pressed="false">旅の中</button>
      </div>
      <span class="device">端末保存</span>
    </header>

    <section class="panel tickets is-active" id="tickets" aria-labelledby="tickets-title">
      <p class="section-code">01 / ARCHIVE</p>
      <h1 id="tickets-title">旅のチケット<small>TRAVEL TICKETS</small></h1>

      <button class="ticket" type="button" data-open-trip aria-label="都城旅行を開く">
        <span class="ticket-top">
          <span>
            <span class="ticket-title">旅のしおり</span>
            <span class="route-text">鹿児島空港 → 都城グリーンホテル</span>
          </span>
          <span class="stamp">計画中<br>あと38日</span>
        </span>
        <span class="ticket-bottom">
          <span>
            <span class="ticket-date">09.21–09.23</span>
            <span class="ticket-meta"><span>2名</span><span>端末保存</span></span>
          </span>
          <span class="ticket-open">開く</span>
        </span>
      </button>

      <button class="issue" type="button">チケットを発行</button>
    </section>

    <section class="panel trip" id="trip" aria-labelledby="trip-title">
      <p class="section-code">02 / OPEN JOURNEY</p>
      <header class="trip-head">
        <div>
          <h2 id="trip-title">大阪から都城へ</h2>
          <p class="trip-name">都城旅行</p>
          <p class="trip-date">2026.09.21–09.23</p>
        </div>
        <div class="seal" aria-label="計画中、あと38日">計画中<br>あと38日</div>
      </header>

      <ul class="facts" aria-label="重要な旅程情報">
        <li><span class="eyebrow">OUTWARD</span><strong>MM193 08:30</strong><small>関西発</small></li>
        <li><span class="eyebrow">RETURN</span><strong>MM198 16:30</strong><small>鹿児島発</small></li>
        <li><span class="eyebrow">STAY</span><strong>都城グリーンホテル</strong></li>
      </ul>

      <section class="next" aria-labelledby="next-title">
        <h3 id="next-title">次の予定</h3>
        <ol class="itinerary">
          <li><time datetime="05:40">05:40</time><span>市岡元町を出る</span></li>
          <li><time datetime="05:50">05:50</time><span>弁天町駅</span></li>
          <li><time datetime="07:00">07:00</time><span>関西空港駅</span></li>
        </ol>
      </section>

      <nav aria-label="旅行内ナビゲーション">
        <ul class="trip-nav">
          <li><button type="button" aria-current="page">ホーム</button></li>
          <li><button type="button">予定</button></li>
          <li><button type="button">お金</button></li>
          <li><button type="button">持ち物</button></li>
          <li><button type="button">共有</button></li>
        </ul>
      </nav>
    </section>
  </main>

  <script>
    (() => {
      const controls = [...document.querySelectorAll('[data-view]')];
      const panels = [...document.querySelectorAll('.panel')];

      function show(view, moveFocus = false) {
        controls.forEach((control) => control.setAttribute('aria-pressed', String(control.dataset.view === view)));
        panels.forEach((panel) => panel.classList.toggle('is-active', panel.id === view));
        if (moveFocus && window.matchMedia('(max-width: 760px)').matches) {
          document.getElementById(view).querySelector('h1, h2').focus({ preventScroll: true });
        }
      }

      controls.forEach((control) => control.addEventListener('click', () => show(control.dataset.view)));
      document.querySelector('[data-open-trip]').addEventListener('click', () => show('trip'));

      panels.forEach((panel) => {
        const heading = panel.querySelector('h1, h2');
        heading.setAttribute('tabindex', '-1');
      });
    })();
  </script>
</body>
</html>
