<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Travel Miyazaki infrastructure architecture</title>
  <desc id="desc">Users access a React progressive web app hosted on Cloudflare Pages. The app calls Pages Functions backed by Cloudflare D1. Functions connect to Google OAuth, Nominatim, and Google Maps, while maps load tiles from OpenFreeMap and OpenStreetMap.</desc>
  <metadata>Service artwork is sourced from Cloudflare, Google Identity, Google Maps, OpenFreeMap, and OpenStreetMap. Source URLs and usage notes are listed in infrastructure-icons/README.md.</metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
    <linearGradient id="cf" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff7ed"/><stop offset="1" stop-color="#ffedd5"/></linearGradient>
    <linearGradient id="pages" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#fff7ed"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity=".10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#475569"/></marker>
    <style>
      .title{font:700 28px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#0f172a}.subtitle{font:400 14px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#64748b}.label{font:700 18px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#0f172a}.service-title{font:700 16px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#0f172a}.small{font:500 13px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#475569}.tiny{font:500 12px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#64748b}.micro{font:500 11px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#64748b}.white{fill:#fff}.line{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#arrow)}.dash{fill:none;stroke:#94a3b8;stroke-width:2;stroke-dasharray:6 6}.box{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;rx:16;filter:url(#shadow)}
    </style>
  </defs>

  <rect width="1200" height="760" rx="24" fill="url(#bg)"/>
  <text x="48" y="54" class="title">Travel Miyazaki — Infrastructure</text>
  <text x="48" y="80" class="subtitle">Cloudflare edge platform architecture</text>

  <!-- User -->
  <g transform="translate(54 302)">
    <rect width="170" height="150" class="box"/>
    <circle cx="85" cy="43" r="20" fill="#334155"/>
    <path d="M48 105c3-27 17-42 37-42s34 15 37 42" fill="#334155"/>
    <text x="85" y="128" text-anchor="middle" class="label">User</text>
    <text x="85" y="144" text-anchor="middle" class="micro">Browser / Installed PWA</text>
  </g>

  <!-- Cloudflare boundary -->
  <rect x="278" y="112" width="650" height="572" rx="24" fill="url(#cf)" stroke="#f97316" stroke-width="2.5"/>
  <image href="infrastructure-icons/cloudflare.svg" x="304" y="126" width="174" height="65" preserveAspectRatio="xMinYMid meet"/>

  <!-- Pages -->
  <g transform="translate(322 198)">
    <rect width="264" height="174" fill="url(#pages)" stroke="#fb923c" stroke-width="1.5" rx="16" filter="url(#shadow)"/>
    <rect x="20" y="20" width="52" height="52" rx="12" fill="#f97316"/>
    <image href="infrastructure-icons/cloudflare-pages.svg" x="28" y="28" width="36" height="36" style="filter:invert(1)"/>
    <text x="88" y="43" class="label">Cloudflare Pages</text>
    <text x="88" y="64" class="small">Static hosting + CDN</text>
    <line x1="20" y1="88" x2="244" y2="88" stroke="#fed7aa"/>
    <text x="20" y="116" class="small">React 19 + TypeScript + Vite</text>
    <text x="20" y="141" class="small">PWA / Service Worker</text>
    <text x="20" y="162" class="tiny">HTML · CSS · JS · manifest · icons</text>
  </g>

  <!-- Functions -->
  <g transform="translate(620 198)">
    <rect width="264" height="286" class="box" stroke="#fb923c"/>
    <rect x="20" y="20" width="52" height="52" rx="12" fill="#f97316"/>
    <image href="infrastructure-icons/cloudflare-workers.svg" x="28" y="28" width="36" height="36" style="filter:invert(1)"/>
    <text x="88" y="43" class="label">Pages Functions</text>
    <text x="88" y="64" class="small">Serverless API</text>
    <line x1="20" y1="88" x2="244" y2="88" stroke="#e2e8f0"/>
    <text x="20" y="116" class="small">/api/groups/*</text><text x="244" y="116" text-anchor="end" class="tiny">共有・同期</text>
    <text x="20" y="151" class="small">/api/auth/*</text><text x="244" y="151" text-anchor="end" class="tiny">OAuth / session</text>
    <text x="20" y="186" class="small">/api/geocode</text><text x="244" y="186" text-anchor="end" class="tiny">住所検索</text>
    <text x="20" y="221" class="small">/api/resolve</text><text x="244" y="221" text-anchor="end" class="tiny">短縮URL展開</text>
    <rect x="20" y="242" width="224" height="26" rx="8" fill="#f1f5f9"/>
    <text x="132" y="260" text-anchor="middle" class="tiny">rate limit · cache · validation</text>
  </g>

  <!-- D1 -->
  <g transform="translate(429 524)">
    <rect width="356" height="116" class="box" stroke="#38bdf8"/>
    <rect x="20" y="24" width="68" height="68" rx="14" fill="#f97316"/>
    <image href="infrastructure-icons/cloudflare-d1.svg" x="30" y="34" width="48" height="48" style="filter:invert(1)"/>
    <text x="104" y="42" class="label">Cloudflare D1</text>
    <text x="104" y="66" class="small">SQLite database</text>
    <text x="104" y="88" class="tiny">groups · users · sessions · tokens</text>
    <text x="104" y="105" class="micro">geocode cache · rate limits</text>
  </g>

  <!-- External services -->
  <text x="960" y="130" class="small">External services</text>
  <g transform="translate(958 150)"><rect width="226" height="90" class="box"/><rect x="18" y="18" width="50" height="50" rx="10" fill="#fff" stroke="#e2e8f0"/><image href="infrastructure-icons/google-g.png" x="28" y="28" width="30" height="30"/><text x="80" y="38" class="service-title">Google OAuth</text><text x="80" y="60" class="micro">Login &amp; identity</text></g>
  <g transform="translate(958 280)"><rect width="226" height="90" class="box"/><image href="infrastructure-icons/openstreetmap.svg" x="18" y="18" width="50" height="50" preserveAspectRatio="xMidYMid meet"/><text x="80" y="38" class="service-title">Nominatim</text><text x="80" y="60" class="micro">OpenStreetMap geocoder</text></g>
  <g transform="translate(958 410)"><rect width="226" height="90" class="box"/><image href="infrastructure-icons/google-maps.png" x="22" y="14" width="42" height="56" preserveAspectRatio="xMidYMid meet"/><text x="80" y="38" class="service-title">Google Maps</text><text x="80" y="60" class="micro">Short URL redirect</text></g>
  <g transform="translate(958 540)"><rect width="226" height="100" class="box"/><image href="infrastructure-icons/openfreemap.jpg" x="18" y="22" width="50" height="50" preserveAspectRatio="xMidYMid slice"/><text x="80" y="36" class="service-title">Map tiles</text><text x="80" y="58" class="micro">OpenFreeMap</text><text x="80" y="76" class="micro">© OpenStreetMap</text></g>

  <!-- Flows -->
  <path d="M224 377H300q22 0 22-22v-70" class="line"/>
  <text x="248" y="357" class="tiny">HTTPS</text>
  <path d="M586 285H620" class="line"/>
  <text x="603" y="272" text-anchor="middle" class="tiny">/api</text>
  <path d="M752 484v24q0 16-16 16H672" class="line"/>
  <text x="760" y="510" class="tiny">SQL</text>
  <path d="M884 270h40q20 0 20-20v-55h14" class="line"/>
  <path d="M884 330h74" class="line"/>
  <path d="M884 395h40q20 0 20 20v40h14" class="line"/>
  <path d="M586 335h20v306q0 20 20 20h298q20 0 20-20v-51h14" class="line"/>
  <text x="630" y="681" class="tiny">MapLibre GL — style &amp; tile requests</text>
  <path d="M322 430H246q-22 0-22-22" class="dash"/>
  <text x="240" y="464" class="tiny">Trip data is also stored locally</text>
  <text x="240" y="482" class="tiny">in the browser (localStorage).</text>
</svg>
