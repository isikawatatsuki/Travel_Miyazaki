services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tabilog
      POSTGRES_USER: tabilog
      POSTGRES_PASSWORD: tabilog
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tabilog -d tabilog"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgres://tabilog:tabilog@postgres:5432/tabilog
      RUST_LOG: tabilog=info,topcoat=info
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
